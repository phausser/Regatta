<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>GeoSail Regatta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #06172d;
      overflow: hidden;
    }

    /* ── HUD container ─────────────────────────────────────────────────────── */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      font-family: 'Roboto', sans-serif;
      color: #e0eeff;
    }

    .hidden {
      display: none !important;
    }

    /* ── Full-screen overlays (menu, finish) ──────────────────────────────── */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: all;
    }

    .panel {
      background: rgba(5, 18, 36, 0.82);
      border: 1px solid rgba(224, 238, 255, 0.12);
      border-radius: 8px;
      padding: 36px 44px;
      text-align: center;
      min-width: 320px;
    }

    /* ── Menu ─────────────────────────────────────────────────────────────── */
    #menu-title {
      font: bold 36px Roboto, sans-serif;
      color: #e0eeff;
      margin-bottom: 4px;
    }

    #menu-subtitle {
      font: 13px 'Roboto Mono', monospace;
      color: rgba(224, 238, 255, 0.58);
      margin-bottom: 28px;
    }

    #menu-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .menu-btn {
      display: block;
      width: 200px;
      padding: 12px 0;
      border: 1px solid rgba(224, 238, 255, 0.10);
      border-radius: 8px;
      background: rgba(224, 238, 255, 0.08);
      color: #e0eeff;
      font: 15px Roboto, sans-serif;
      cursor: pointer;
    }

    .menu-btn:hover,
    .menu-btn.active {
      background: rgba(224, 238, 255, 0.16);
      font-weight: 700;
    }

    #menu-scores {
      margin-top: 20px;
      font: 11px 'Roboto Mono', monospace;
      color: rgba(224, 238, 255, 0.46);
    }

    #menu-scores .gold {
      color: #e0eeff;
      font-weight: 700;
    }

    #menu-hint {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font: 10px 'Roboto Mono', monospace;
      color: rgba(255, 255, 255, 0.30);
      pointer-events: none;
    }

    /* ── Finish overlay ───────────────────────────────────────────────────── */
    #finish-heading {
      font: bold 26px Roboto, sans-serif;
      color: #e0eeff;
      margin-bottom: 12px;
    }

    #finish-time {
      font: 22px 'Roboto Mono', monospace;
      color: #e0eeff;
      margin-bottom: 8px;
    }

    #finish-rank {
      font: 13px Roboto, sans-serif;
      min-height: 20px;
      margin-bottom: 8px;
    }

    .finish-gold {
      color: #ffdc50;
    }

    #finish-scores {
      font: 11px 'Roboto Mono', monospace;
      color: rgba(224, 238, 255, 0.58);
      margin-bottom: 24px;
    }

    #finish-scores .hi {
      font-weight: 700;
      color: #e0eeff;
      font-size: 12px;
    }

    #finish-scores .scores-label {
      color: rgba(224, 238, 255, 0.40);
      margin-bottom: 4px;
    }

    .panel-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .panel-buttons .menu-btn {
      width: 130px;
    }

    /* ── In-game HUD ──────────────────────────────────────────────────────── */
    #hud-game {
      position: absolute;
      inset: 0;
    }

    /* Wind instruments (top-left) */
    #wind-instruments {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    #compass-canvas,
    #vane-canvas {
      display: block;
    }

    /* Race info (top-right) */
    #race-hud {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(5, 18, 36, 0.76);
      border: 1px solid rgba(224, 238, 255, 0.12);
      border-radius: 8px;
      padding: 8px 10px;
      min-width: 200px;
      font: 12px 'Roboto Mono', monospace;
      color: #e0eeff;
      line-height: 18px;
    }

    /* Mute indicator (bottom-left) */
    #mute-indicator {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font: 12px 'Roboto Mono', monospace;
      color: rgba(224, 238, 255, 0.50);
    }

    /* ── Tutorial panel (bottom) ──────────────────────────────────────────── */
    #tutorial-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 110px;
      background: rgba(5, 18, 36, 0.82);
      border-top: 1px solid rgba(224, 238, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    #tutorial-step {
      font: 11px 'Roboto Mono', monospace;
      color: rgba(224, 238, 255, 0.58);
    }

    #tutorial-dots {
      display: flex;
      gap: 10px;
    }

    .tdot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(224, 238, 255, 0.22);
    }

    .tdot.done {
      background: #e0eeff;
    }

    #tutorial-title {
      font: bold 16px Roboto, sans-serif;
      color: #e0eeff;
    }

    #tutorial-hint {
      font: 12px 'Roboto Mono', monospace;
      color: rgba(224, 238, 255, 0.58);
    }

    #tutorial-metric {
      font: 11px 'Roboto Mono', monospace;
      color: #e0eeff;
    }

    #tutorial-progress-wrap {
      width: min(320px, 40vw);
      height: 6px;
      background: rgba(224, 238, 255, 0.20);
      border-radius: 3px;
      overflow: hidden;
    }

    #tutorial-progress {
      height: 100%;
      background: #e0eeff;
      width: 0%;
    }

    /* ── Debug overlay (bottom-right) ────────────────────────────────────── */
    #debug-panel {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(5, 18, 36, 0.76);
      border: 1px solid rgba(224, 238, 255, 0.12);
      border-radius: 8px;
      padding: 8px 10px;
      font: 12px 'Roboto Mono', monospace;
      color: rgba(224, 238, 255, 0.62);
      line-height: 18px;
    }

    .scores-label {
      color: rgba(224, 238, 255, 0.40);
      margin-bottom: 4px;
    }
  </style>
</head>

<body>
  <div id="hud">

    <!-- ── Menu ────────────────────────────────────────────────────────────── -->
    <div id="screen-menu" class="screen">
      <div class="panel">
        <div id="menu-title">GeoSail</div>
        <div id="menu-subtitle">Regatta</div>
        <div id="menu-buttons">
          <button id="btn-race" class="menu-btn">Rennen starten</button>
          <button id="btn-tutorial" class="menu-btn">Tutorial</button>
        </div>
        <div id="menu-scores"></div>
      </div>
      <div id="menu-hint">↑↓ navigieren · Enter bestätigen</div>
    </div>

    <!-- ── Finish overlay ──────────────────────────────────────────────────── -->
    <div id="screen-finish" class="screen hidden">
      <div class="panel">
        <div id="finish-heading">Ziel erreicht!</div>
        <div id="finish-time"></div>
        <div id="finish-rank"></div>
        <div id="finish-scores"></div>
        <div class="panel-buttons">
          <button id="btn-restart" class="menu-btn">Nochmal</button>
          <button id="btn-back-menu" class="menu-btn">Hauptmenü</button>
        </div>
      </div>
    </div>

    <!-- ── In-game HUD ─────────────────────────────────────────────────────── -->
    <div id="hud-game" class="hidden">
      <div id="wind-instruments">
        <canvas id="compass-canvas" width="90" height="105"></canvas>
        <canvas id="vane-canvas" width="90" height="105"></canvas>
      </div>
      <div id="race-hud"></div>
      <div id="mute-indicator" class="hidden">MUTE M</div>
    </div>

    <!-- ── Tutorial panel ──────────────────────────────────────────────────── -->
    <div id="tutorial-panel" class="hidden">
      <div id="tutorial-step"></div>
      <div id="tutorial-dots"></div>
      <div id="tutorial-title"></div>
      <div id="tutorial-hint"></div>
      <div id="tutorial-metric"></div>
      <div id="tutorial-progress-wrap">
        <div id="tutorial-progress"></div>
      </div>
    </div>

    <!-- ── Debug overlay ────────────────────────────────────────────────────── -->
    <div id="debug-panel" class="hidden"></div>

  </div>

  <script src="js/input.js"></script>
  <script src="js/wind.js"></script>
  <script src="js/boat.js"></script>
  <script src="js/race.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/waterMesh.js"></script>
  <script src="js/boatMesh.js"></script>
  <script src="js/marksMesh.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/scoreApi.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
